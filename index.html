/* ── TYPE ── */
.sm{font-size:13px;letter-spacing:.35em;text-transform:uppercase;color:var(--g);font-weight:600}
h1,h2,h3{font-family:"Great Vibes",cursive;font-weight:400;color:var(--g);line-height:1.1}
h2{font-size:54px}
/* İsimler: mobilden taşmasın */
.names{font-size:clamp(52px,15vw,96px);line-height:1.0;margin:12px 0;
  color:var(--g);text-shadow:0 2px 18px rgba(75,90,68,.18)}
.names i{display:block;font-style:normal;color:var(--gold);font-size:clamp(36px,10vw,60px);text-shadow:0 2px 10px rgba(169,138,76,.2)}
.orn{display:flex;align-items:center;gap:10px;margin:16px auto;width:min(240px,70%)}
.orn::before,.orn::after{content:"";flex:1;height:1px;background:var(--gold)}
.orn b{width:8px;height:8px;background:var(--gold);transform:rotate(45deg);display:block;flex-shrink:0}
.dt{letter-spacing:.18em;font-size:clamp(16px,4.5vw,22px);font-weight:500}
.sub{color:#6a7a64;font-size:clamp(14px,3.5vw,17px);margin-top:4px}

/* ── HERO ── */
.hero{min-height:100vh;display:flex;flex-direction:column;justify-content:center;padding-top:72px}
.hbg{position:absolute;inset:0;width:100%;height:100%;z-index:0}

/* ── COUNTDOWN ── */
.frame{border:1px solid var(--gold);padding:7px;max-width:400px;margin:22px auto}
.frame>div{border:1px solid rgba(169,138,76,.35);padding:24px 10px}
.cd{display:flex}
.cd div{flex:1;border-left:1px solid rgba(75,90,68,.18)}.cd div:first-child{border:0}
.cd b{display:block;font:600 clamp(28px,8vw,42px) "Cormorant Garamond",serif;color:var(--ink)}
.cd span{font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:var(--g)}

/* ── BUTTONS ── */
.btn{display:block;width:100%;max-width:380px;margin:10px auto 0;padding:13px;border:1px solid var(--g);color:var(--g);background:none;font:600 13px "Cormorant Garamond",serif;letter-spacing:.28em;text-transform:uppercase;text-decoration:none;cursor:pointer}
.btn.f{background:var(--g);color:#fff}

/* ── MAP: yarım daire + sadece yol tarifi butonu ── */
.map-arch{max-width:min(320px,78vw);height:min(260px,60vw);margin:20px auto 0;border-radius:999px 999px 0 0;overflow:hidden;border:1px solid var(--gold);display:block;position:relative}
.map-arch svg{display:block;width:100%;height:100%}

/* ── SCHEDULE arch ── */
.arch{background:var(--g);color:#f4efe4;border-radius:999px 999px 0 0;max-width:380px;margin:0 auto;padding:68px 20px 54px;position:relative}
.arch::before{content:"";position:absolute;inset:12px;border:1px solid rgba(255,255,255,.18);border-radius:999px 999px 0 0;pointer-events:none}
.arch h2{color:#f4efe4}
.ev b{color:#d4b97a;letter-spacing:.28em;font-size:13px}
.ev h3{font-size:clamp(32px,9vw,44px);color:#f4efe4;margin:0}
.ev p{opacity:.88;margin:0;font-size:clamp(14px,3.5vw,17px)}
.ev+.ev::before{content:"";display:block;width:1px;height:34px;background:rgba(255,255,255,.25);margin:16px auto}

/* ── RSVP ── */
.fm label{display:block;text-align:left;font-size:12px;letter-spacing:.28em;text-transform:uppercase;color:var(--g);margin:18px 0 4px;font-weight:600}
.fm input[type=text],.fm input[type=number]{width:100%;border:0;border-bottom:1px solid rgba(75,90,68,.3);background:none;padding:7px 0;font:400 19px "Cormorant Garamond",serif;color:var(--ink);border-radius:0}
.fm .rd{display:flex;gap:10px;align-items:center;font-size:clamp(15px,4vw,19px);margin:8px 0}
.fm .rd input{width:18px;accent-color:var(--g)}

/* ── FOOTER ── */
.ft{background:var(--g);color:#f4efe4;padding:52px 22px 80px;text-align:center;position:relative;overflow:hidden}
.ft::before{content:"";position:absolute;inset:12px;border:1px solid rgba(255,255,255,.18);pointer-events:none}

function R(){
  var dt=new Date(D.date+"T"+(D.time||"00:00")),end=new Date(dt.getTime()+144e5);
  var long=fd(D.date,{day:"numeric",month:"long",year:"numeric"});
  var by=fd(D.rsvpBy,{day:"numeric",month:"long",year:"numeric"});
  var q=encodeURIComponent(D.venue+" "+D.addr);
  var isIOS=/iphone|ipad|ipod/i.test(navigator.userAgent);
  var calDates=isNaN(dt)?"":iso(dt)+"/"+iso(end);
  /* Takvim: iOS → .ics blob indir, diğer → Google Calendar */
  var cal=isIOS?"#ics":"https://calendar.google.com/calendar/render?action=TEMPLATE&text="+encodeURIComponent(D.n1+" & "+D.n2+" Nişan")+"&dates="+calDates+"&location="+q;
  /* Harita: iOS → Apple Maps, diğer → Google Maps */
  var gMapDir="https://www.google.com/maps/dir/?api=1&destination=LELE+GARDENS+Ankara";
  var appleMapDir="https://maps.apple.com/?daddr=LELE+GARDENS+Ankara&dirflg=d";
  var mapL=esc(isIOS?appleMapDir:(D.mapLink||gMapDir));

  $("inv").innerHTML=

  /* 1. HERO */
  '<section class="sec hero">'
  +HEROBG
  +'<div class="si">'
  +'<div class="sym">'+RING+'</div>'
  +'<p class="sm">'+esc(D.kicker)+'</p>'
  +'<h1 class="names">'+esc(D.n1)+'<i>&amp;</i>'+esc(D.n2)+'</h1>'
  +'<div class="orn"><b></b></div>'
  +'<p class="dt">'+esc(long)+'</p>'
  +'<p class="sub">'+esc(D.venue)+' &middot; '+esc(D.place)+'</p>'
  +'</div></section>'

  /* 2. YÜZÜK – GERİ SAYIM */
  +'<section class="sec"><div class="si">'
  +'<div class="sym">'+RING+'</div>'
  +'<h2>Geri Sayım</h2>'
  +'<p class="sm" style="margin-top:4px">'+esc(D.cdSub)+'</p>'
  +'<div class="frame"><div><div class="cd" id="cd"></div></div></div>'
  +'</div></section>'

  /* 3. KADEH – KONUM: sadece dekoratif harita + yol tarifi butonu */

  +'<div class="sym">'+FLUTE+'</div>'
  +'<p class="sm">'+esc(D.mapKicker)+'</p>'
  +'<div class="map-arch">'+MAPSVG+'</div>'
  +'<h2>'+esc(D.venue)+'</h2>'
  +'<p class="sub">'+esc(D.addr)+'</p>'
  +'<a class="btn" href="'+mapL+'" target="_blank" rel="noopener">Yol Tarifi Al</a>'
  +'<button class="btn" id="calbtn">Takvime Ekle</button>'
  +'</div></section>'

  /* 4. DİSKO – PROGRAM */

  +'<div class="sym">'+DISCO+'</div>'
  +'<div class="arch">'
  +'<p class="sm" style="color:#c8d8c4">'+esc(D.dayTitle)+'</p>'
  +'<h2>'+esc(long)+'</h2>'
  +'<div style="height:28px"></div>'

  +'</div></div></section>'

  /* 5. AVIZE – RSVP */
  +'<section class="sec"><div class="si">'
  +'<div class="sym">'+CHAN+'</div>'
  +'<h2>Katılımınızı Bildirin</h2>'

  +'<div class="frame" style="margin-top:16px"><div class="fm">'
  +'<label>Ad Soyad</label><input id="r1" type="text" placeholder="Adınız">'
  +'<label>Katılacak mısınız?</label>'
  +'<label class="rd"><input type="radio" name="at" value="Memnuniyetle katılacağım" checked>Memnuniyetle katılacağım</label>'
  +'<label class="rd"><input type="radio" name="at" value="Maalesef katılamayacağım">Maalesef katılamayacağım</label>'
  +'<label>Kişi Sayısı</label><input id="r3" type="number" min="1" value="1">'
  +'<button class="btn f" style="margin-top:22px" onclick="sendRsvp()">RSVP Gönder</button>'
  +'</div></div>'
  +'</div></section>'

  /* 6. FOOTER */
  +'<div class="ft">'+CHAN
  +'<h2 style="margin-top:14px">'+esc(D.n1)+' &amp; '+esc(D.n2)+'</h2>'
  +'<div class="orn" style="margin:14px auto"><b></b></div>'
  +'</div>';

  document.title=D.n1+" & "+D.n2+" – Nişan Davetiyesi";

}

function sendRsvp(){

function tick(){
  var e=$("cd"); if(!e) return;
  var s=Math.max(0,Math.floor((new Date(D.date+"T"+(D.time||"00:00"))-new Date())/1e3));
  if(isNaN(s)) s=0;
  e.innerHTML=[[Math.floor(s/86400),"Gün"],[Math.floor(s%86400/3600),"Saat"],[Math.floor(s%3600/60),"Dakika"],[s%60,"Saniye"]]
    .map(function(x){return"<div><b>"+p2(x[0])+"</b><span>"+x[1]+"</span></div>"}).join("");
}
setInterval(tick,1000);
R();

document.addEventListener("click",function(e){

/* Edit panel */
var SC=[["n1","1. İsim"],["n2","2. İsim"],["date","Tarih","date"],["time","Saat","time"],["venue","Mekân Adı"],["place","Şehir / İlçe"],["addr","Adres"],["kicker","Üst Başlık"],["rsvpBy","Son Yanıt Tarihi","date"],["email","RSVP E-postası"],["mapLink","Yol Tarifi Linki"],["cdSub","Geri Sayım Alt Başlığı"],["mapKicker","Harita Başlığı"],["dayTitle","Program Başlığı"]];
var AR={sched:["Gün Programı",[["t","Saat"],["h","Başlık"],["d","Açıklama"]]]};

function edUI(){
  var h="<h3>Davetiyeyi Düzenle</h3>";
  SC.forEach(function(s){h+='<label>'+s[1]+'</label><input type="'+(s[2]||"text")+'" data-k="'+s[0]+'" value="'+esc(D[s[0]]||"")+'">';});
  for(var k in AR){h+="<h4>"+AR[k][0]+"</h4>";D[k].forEach(function(o,i){h+='<div class="bx">';AR[k][1].forEach(function(f){h+='<label>'+f[1]+'</label><textarea rows="2" data-a="'+k+"."+i+"."+f[0]+'">'+esc(o[f[0]])+"</textarea>";});h+='<button data-del="'+k+"."+i+'">Sil</button></div>';});h+='<button data-add="'+k+'">+ Ekle</button>';}
  h+='<div style="margin-top:14px"><button class="sv" id="sv">Kaydet ve Yayınla</button><button id="cl">Kapat</button></div><p id="st" style="margin-top:7px;font-size:13px;color:#666"></p>';
  $("ed").innerHTML=h;
}

function build(){
  var j=JSON.stringify(D,null,0).replace(/</g,"\u003c");
  return'<!DOCTYPE html>\n<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>'+esc(D.n1+" & "+D.n2)+' – Nişan Davetiyesi</title><link href="'+document.querySelector("link[href*=fonts]").href+'" rel="stylesheet"><style id="css">'+$("css").textContent+'</style></head><body class="lock"><div id="seal"><button class="seal-tap" id="sb" aria-label="Mührü aç"></button><p>Açmak için mühre dokunun</p></div><div id="inv"></div><button id="fab" aria-label="Düzenle">✎</button><div id="ed"></div><script type="application/json" id="data">'+j+'<\/script><script id="js">'+$("js").textContent+'<\/script></body></html>';
}

function enableEdit(){
  edUI(); $("fab").style.display="block";
  var E=$("ed");
  $("fab").onclick=function(){E.classList.toggle("on");};
  E.addEventListener("input",function(ev){var t=ev.target;if(t.dataset.k) D[t.dataset.k]=t.value;else if(t.dataset.a){var a=t.dataset.a.split(".");D[a[0]][+a[1]][a[2]]=t.value;}R();});
  E.addEventListener("click",function(ev){
    var t=ev.target;
    if(t.dataset.del){var a=t.dataset.del.split(".");D[a[0]].splice(+a[1],1);edUI();R();}
    else if(t.dataset.add){var k=t.dataset.add,o={};AR[k][1].forEach(function(f){o[f[0]]="";});D[k].push(o);edUI();R();}
    else if(t.id==="cl") E.classList.remove("on");
    else if(t.id==="sv"){
      $("st").textContent="Kaydediliyor…";
      claude.use("artifact").then(function(a){if(!a){$("st").textContent="Kayıt kullanılamıyor.";return;}return a.publish(build());})
      .then(function(){$("st").textContent="Kaydedildi ✓";})
      .catch(function(e){$("st").textContent="Hata: "+(e&&e.code||"bilinmiyor");});
    }
  });
}
try{if(window.claude){claude.use("user").then(function(u){return u&&u.isOwner();}).then(function(o){if(o) enableEdit();}).catch(function(){});}}catch(e){}
